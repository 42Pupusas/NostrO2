[package]
name = "nostro2-cache"
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Mutex-guarded LRU event-ID deduplication cache for the Nostr protocol."
repository = "https://github.com/42Pupusas/NostrO2"
homepage = "https://github.com/42Pupusas/NostrO2"
readme = "README.md"
categories = ["caching", "data-structures"]
keywords = ["nostr", "cache", "lru", "deduplication"]

[dependencies]
lru = "0.12"

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "deduplication"
path = "../../benches/deduplication.rs"
harness = false

