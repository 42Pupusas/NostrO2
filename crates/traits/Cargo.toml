[package]
name = "nostro2-traits"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
categories = ["authentication", "cryptography"]
keywords = ["nostr", "signer", "traits", "schnorr"]
license = "MIT"
description = "Signing traits for the nostro2 ecosystem (NostrSigner, NostrKeypair)."
repository = "https://github.com/42Pupusas/NostrO2"
homepage = "https://github.com/42Pupusas/NostrO2"
documentation = "https://docs.rs/nostro2-traits"

[dev-dependencies]
divan.workspace = true
hex = "0.4"
proptest = "1"

[[bench]]
name = "hex_bench"
path = "../../benches/hex_bench.rs"
harness = false
