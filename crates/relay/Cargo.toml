[package]
name = "nostro2-relay"
version = "0.6.0"
edition = "2024"
rust-version = "1.87"
categories = ["authentication", "cryptography", "web-programming"]
keywords = ["nostr", "relay", "websocket", "client"]
license = "MIT"
description = "WebSocket relay client and connection pool for the Nostr protocol"
repository = "https://github.com/42Pupusas/NostrO2"
readme = "README.md"
homepage = "https://github.com/42Pupusas/NostrO2"
documentation = "https://docs.rs/nostro2-relay"

[features]
default = ["rustls-ring", "serde", "k256"]
rustls-ring = ["rustls/ring"]
rustls-aws-lc = ["rustls/aws-lc-rs"]
# Curve backend for inbound signature checking. Without one the driver
# cannot inspect a signature and admits every note it parses, so a relay
# could forge events from any pubkey. Mutually exclusive, like the JSON
# backends.
# Forwarded into the dev-only NIP/signer crates for the same reason as the
# JSON backends: Cargo unifies features across a package's normal and dev
# dependency graphs, so a dev-dependency that pins one curve makes the
# other curve impossible to test.
k256 = ["nostro2/k256", "nostro2-nips/k256", "nostro2-signer/k256"]
secp256k1 = ["nostro2/secp256k1", "nostro2-nips/secp256k1", "nostro2-signer/secp256k1"]
# JSON backend: forwarded to `nostro2`, mutually exclusive, `serde` is
# the default (see `nostro2`'s `lib.rs` for the enforcing `compile_error!`).
# Forwarded into the dev-only NIP/signer crates too, so `cargo test` never
# unifies both backends onto `nostro2` at once (which would trip its
# `compile_error!`).
bourne = ["dep:json-bourne", "nostro2/bourne", "nostro2-nips/bourne", "nostro2-signer/bourne"]
serde = ["dep:serde", "dep:serde_json", "nostro2/serde", "nostro2-nips/serde", "nostro2-signer/serde"]

[dependencies]
# Only for the `Stream` bound on `NostrRelay::send_all`. The crate drives no
# executor of its own: every connection runs on a plain thread.
futures-util.workspace = true
log = "0.4"

quetzalcoatl.workspace = true
coyoquil.workspace = true
webpki-roots.workspace = true

nostro2 = { workspace = true, default-features = false }
nostro2-cache.workspace = true
json-bourne = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rustls = { version = "0.23", features = ["std", "tls12"], default-features = false }

[dev-dependencies]
# An independent RFC-6455 implementation, used as the test server so the
# socket tests prove interop rather than codec self-consistency. Sync, so
# the tests need no async runtime at all.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Tests and benchmarks only: they drive the crate's futures and need an
# executor. The library itself pulls in no runtime.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
nostro2-signer = { workspace = true, default-features = false }
nostro2-nips = { workspace = true, default-features = false }
nostro2-traits.workspace = true
divan.workspace = true
lru.workspace = true
# The reference tokio implementation, used as the comparison arm in the
# pipeline benchmark. Never a real dependency: `cargo tree -i nostr-sdk`
# on the library graph prints nothing.
nostr-sdk = { version = "0.45", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false
