[package]
name = "nostro2-nips"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
categories = ["authentication", "cryptography", "web-programming"]
keywords = ["nostr", "nips", "nip44", "nip04", "encryption"]
license = "MIT"
description = "NIP implementations (NIP-04, NIP-44, NIP-104, …) for the nostro2 Nostr toolset."
repository = "https://github.com/42Pupusas/NostrO2"
readme = "../../README.md"
homepage = "https://github.com/42Pupusas/NostrO2"
documentation = "https://docs.rs/nostro2-nips"

[features]
# `nostro2-nips` calls `NostrNote::verify()` (curve-gated in `nostro2`),
# so it must forward a curve to `nostro2`. The default mirrors the
# historical behaviour. Consumers who want `secp256k1` should set
# `default-features = false` and pick the `secp256k1` feature here.
# These features only forward to `nostro2` — `nostro2-nips` does not
# link any curve crate of its own. Schnorr signing goes through the
# `NostrSigner` trait, ECDH through `NostrKeypair`, and verification
# through `NostrNote::verify`. The HKDF/HMAC/SHA2 primitives used by
# NIP-04/NIP-44 come from their own RustCrypto crates.
# JSON backend: forwarded to `nostro2`, mutually exclusive, `serde` is
# the default (see `nostro2`'s `lib.rs` for the enforcing `compile_error!`).
default = ["k256", "serde"]
k256 = ["nostro2/k256"]
secp256k1 = ["nostro2/secp256k1"]
bourne = ["dep:json-bourne", "nostro2/bourne"]
serde = ["dep:serde", "dep:serde_json", "nostro2/serde"]

[dependencies]
base64.workspace = true
chacha20.workspace = true
hkdf.workspace = true
hmac.workspace = true
nostro2 = { workspace = true, default-features = false }
nostro2-traits.workspace = true
getrandom.workspace = true
json-bourne = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
# Tests need a concrete keypair to exercise the trait-bounded NIP impls;
# `NipTester` in `lib.rs` wraps `k256::schnorr::SigningKey` for that.
# Production code in this crate has no curve dependency.
k256.workspace = true

