[package]
name = "nostro2"
version = "0.8.0"
edition = "2024"
rust-version = "1.87"
categories = ["authentication", "cryptography", "web-programming"]
keywords = ["nostr", "protocol", "events", "schnorr"]
license = "MIT"
description = "Nostro2 is a simple toolset for interacting with the Nostr protocol."
repository = "https://github.com/42Pupusas/NostrO2"
readme = "../../README.md"
homepage = "https://github.com/42Pupusas/NostrO2"
documentation = "https://docs.rs/nostro2"

[features]
# No default curve. Cargo unifies features across the dep graph, so
# defaulting to a curve here would silently force *every* downstream
# consumer of `nostro2` to use that curve unless they remembered to set
# `default-features = false`. Picking up the curve via a sibling crate
# (e.g. `nostro2-signer`'s default) is fine — that's an explicit choice
# by whichever crate the consumer reached for. The `compile_error!` in
# `lib.rs` enforces that you do not pick both.
#
# JSON backend: `bourne` and `serde` are mutually exclusive — pick
# exactly one. `serde` is the default so upgrading `nostro2` without
# touching `Cargo.toml` keeps working; opt into `bourne` explicitly for
# its zero-copy `*View` types and lower allocation count. The
# `compile_error!` in `lib.rs` enforces the exclusivity.
default = ["serde"]
# Forwarded into the dev-only `nostro2-signer` dep too, so `cargo test`
# never unifies both backends onto this same crate at once (which would
# trip the `compile_error!` below).
bourne = ["dep:json-bourne", "nostro2-signer/bourne"]
serde = ["dep:serde", "dep:serde_json", "nostro2-signer/serde"]
# Forwarded into the dev-only `nostro2-signer` dep for the same reason as
# the JSON backends: a dev-dependency that pins one curve makes the other
# curve impossible to test, because Cargo unifies features across a
# package's normal and dev graphs. Since this crate has no default curve,
# `cargo test -p nostro2` needs one named explicitly.
k256 = ["dep:k256", "nostro2-signer/k256"]
secp256k1 = ["dep:secp256k1", "nostro2-signer/secp256k1"]

[dependencies]
k256 = { workspace = true, optional = true }
secp256k1 = { workspace = true, optional = true }
json-bourne = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
nostro2-traits.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# `k256`'s curve init pulls in `crypto-bigint -> getrandom`, which on
# `wasm32-unknown-unknown` requires the `wasm_js` feature to find a
# JS-backed entropy source. Cargo features are additive across the graph,
# so flipping it here flips it for every transitive copy.
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# Path-only (no version): `nostro2-signer` depends back on `nostro2`, so a
# versioned dev-dep would be an unsatisfiable cycle at publish time (signer
# 0.5.0 can't exist on crates.io until core is published, and core won't
# publish while it requires it). `cargo publish` drops path-only dev-deps
# from the uploaded manifest, breaking the cycle; local builds still resolve.
nostro2-signer = { path = "../signer", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
divan.workspace = true
proptest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[[bench]]
name = "serialization"
path = "../../benches/serialization.rs"
harness = false

[[bench]]
name = "subscription"
path = "../../benches/subscription.rs"
harness = false


