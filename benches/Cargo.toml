[package]
name = "nostro2-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cross-library comparison benchmarks (nostro2 vs upstream nostr crate)."

[features]
# `serde` matches the workspace-wide default so `cargo build --workspace`
# doesn't unify conflicting `nostro2/bourne` + `nostro2/serde` requests
# across sibling packages (Cargo unifies features for a shared dependency
# across an entire `--workspace` build, and the two are mutually
# exclusive). Run with `--no-default-features --features k256,bourne` to
# benchmark the bourne backend instead.
default = ["k256", "serde"]
k256 = [
    "nostro2/k256",
    "nostro2-signer/k256",
    "nostro2-nips/k256",
]
secp256k1 = [
    "nostro2/secp256k1",
    "nostro2-signer/secp256k1",
    "nostro2-nips/secp256k1",
]
bourne = ["nostro2/bourne", "nostro2-signer/bourne", "nostro2-nips/bourne"]
serde = ["nostro2/serde", "nostro2-signer/serde", "nostro2-nips/serde"]

[dependencies]

[dev-dependencies]
nostro2 = { workspace = true, default-features = false }
nostro2-signer = { workspace = true, default-features = false }
nostro2-nips = { workspace = true, default-features = false }
divan.workspace = true
json-bourne.workspace = true
serde_json = "1"
nostr = { version = "0.44", features = ["nip44"] }
# Direct access to the raw curve primitives so `verify_sig_only` can call
# Schnorr verify without the JSON/SHA-256 wrapping in `note.verify()`. Each is
# only referenced under its matching `#[cfg(feature)]`.
k256 = { workspace = true }
secp256k1 = { workspace = true }

[[bench]]
name = "nostr_comparison"
path = "nostr_comparison.rs"
harness = false

[[bench]]
name = "crypto"
path = "crypto.rs"
harness = false

[[bench]]
name = "nip104"
path = "nip104.rs"
harness = false
